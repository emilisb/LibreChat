services:
  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ping:1})']
      interval: 10s
      timeout: 5s
      retries: 10

  setup:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
    command: >
      bash -lc "cp -n .env.example .env; cp -n librechat.example.yaml librechat.yaml; npm install --no-audit --no-fund && npm run build:packages; mkdir -p client/dist && [ -f client/dist/index.html ] || echo '<html>dev</html>' > client/dist/index.html"

  api:
    image: node:24
    working_dir: /app
    command: bash -lc "npx nodemon api/server/index.js"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - DOMAIN_CLIENT=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DOMAIN_SERVER=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NO_PROXY=localhost,127.0.0.1,mongodb
      - SEARCH=false
      - MEILI_HOST=
      - MEILI_MASTER_KEY=
    env_file:
      - /run/base44/app.env
    ports:
      - '3080:3080'
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  client:
    image: node:24
    working_dir: /app/client
    command: bash -lc "npx vite --host 0.0.0.0 --port 3000"
    environment:
      - NODE_ENV=development
      - HOST=api
      - PORT=3000
      - BACKEND_PORT=3080
      - VITE_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  mongo-data:
