services:
  setup:
    image: node:24.16.0-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
        echo '=== Installing dependencies ===' &&
        npm ci --no-audit &&
        echo '=== Building packages ===' &&
        npm run build:packages &&
        echo '=== Creating client dist placeholder ===' &&
        mkdir -p /app/client/dist &&
        echo '<!DOCTYPE html><html><head><title>LibreChat</title></head><body>Dev mode - use Vite client</body></html>' > /app/client/dist/index.html &&
        echo '=== Setup complete ==='
      "
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    image: node:24.16.0-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
    command: >
      sh -c "npx nodemon api/server/index.js"
    depends_on:
      setup:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped

  client:
    image: node:24.16.0-alpine
    working_dir: /app
    ports:
      - "3000:3090"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - HOST=api
      - PORT=3090
      - NODE_ENV=development
      - BACKEND_PORT=3080
      - VITE_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: >
      sh -c "cd client && npx vite --host 0.0.0.0 --port 3090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      setup:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20
    restart: always
    volumes:
      - mongo_data:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt
    volumes:
      - meili_data:/meili_data

volumes:
  node_modules:
  mongo_data:
  meili_data:
