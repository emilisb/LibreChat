services:
  mongodb:
    image: mongo:8.0
    restart: always
    volumes:
      - mongo_data:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=base44devkey123
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  setup:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      - nm_cache:/app/node_modules
    command: >
      bash -c "
        if [ ! -f /app/node_modules/.install_done ]; then
          npm install &&
          touch /app/node_modules/.install_done
        fi &&
        npm run build:data-provider &&
        npm run build:data-schemas &&
        npm run build:api &&
        cd /app/packages/client && npm run build
      "
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096

  backend:
    image: node:22
    working_dir: /app
    ports:
      - "3080:3080"
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - nm_cache:/app/node_modules
    command: npx nodemon api/server/index.js
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=base44devkey123
      - SEARCH=true
      - DOMAIN_CLIENT=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DOMAIN_SERVER=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - CREDS_KEY=f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
      - CREDS_IV=e2341419ec3dd3d19b13a1a87fafcbfb
      - JWT_SECRET=16f8c0ef4a5d391b26034086c628469d3f9f497f08163ab9b40137092f2909ef
      - JWT_REFRESH_SECRET=eaa5191f2914e30b9387fd84e254e4ba6fc51b4654968a9b0803b456a54b8418
      - ALLOW_EMAIL_LOGIN=true
      - ALLOW_REGISTRATION=true
      - ALLOW_SOCIAL_LOGIN=false
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=true
      - SESSION_EXPIRY=1000 * 60 * 15
      - REFRESH_TOKEN_EXPIRY=(1000 * 60 * 60 * 24) * 7
      - OPENAI_API_KEY=user_provided
      - ANTHROPIC_API_KEY=user_provided
      - GOOGLE_KEY=user_provided
      - ASSISTANTS_API_KEY=user_provided
      - BAN_VIOLATIONS=true
      - BAN_DURATION=1000 * 60 * 60 * 2
      - BAN_INTERVAL=20
      - LOGIN_VIOLATION_SCORE=1
      - REGISTRATION_VIOLATION_SCORE=1
      - CONCURRENT_VIOLATION_SCORE=1
      - MESSAGE_VIOLATION_SCORE=1
      - NON_BROWSER_VIOLATION_SCORE=20
      - LOGIN_MAX=7
      - LOGIN_WINDOW=5
      - REGISTER_MAX=5
      - REGISTER_WINDOW=60
      - LIMIT_CONCURRENT_MESSAGES=true
      - CONCURRENT_MESSAGE_MAX=2
      - LIMIT_MESSAGE_IP=true
      - MESSAGE_IP_MAX=40
      - MESSAGE_IP_WINDOW=1
      - LIMIT_MESSAGE_USER=false
      - MESSAGE_USER_MAX=40
      - MESSAGE_USER_WINDOW=1
      - NO_INDEX=true
      - DEBUG_LOGGING=true
      - DEBUG_CONSOLE=false
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    restart: unless-stopped

  frontend:
    image: node:24
    working_dir: /app/client
    ports:
      - "3000:3090"
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - nm_cache:/app/node_modules
    command: npx vite --host 0.0.0.0 --port 3090
    environment:
      - HOST=backend
      - PORT=3090
      - NODE_ENV=development
      - VITE_ALLOWED_HOSTS=3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BACKEND_PORT=3080
      - DOMAIN_CLIENT=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DOMAIN_SERVER=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    restart: unless-stopped

volumes:
  mongo_data:
  meili_data:
  nm_cache:
